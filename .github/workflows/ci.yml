name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags, for the changelog reminder
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm ci --no-audit --no-fund

      - name: Generated files are up to date
        run: node scripts/build.js --check

      - name: Ports (L1 parse + L2 contracts and parity, with negative controls)
        run: node scripts/check-ports.js

      - name: Icons (every association resolves, every SVG renders, none blank)
        run: node scripts/check-icons.js

      - name: Contrast gate (WCAG)
        run: node scripts/contrast.js --report

      - name: Relative links resolve (the weekly Health check covers external ones)
        run: node scripts/check-links.js --local

      - name: Changelog reminder (shipped changes since the last tag need an Unreleased note)
        run: |
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          [ -n "$last" ] || exit 0
          changed=$(git diff --name-only "$last" HEAD -- palette templates scripts site icons themes extensions zed ports | head -1)
          if [ -n "$changed" ] && ! grep -q "^## Unreleased" CHANGELOG.md; then
            echo "::warning file=CHANGELOG.md::Changes since $last (e.g. $changed) but no '## Unreleased' section in CHANGELOG.md"
          fi

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out brass-lasers.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: brass-lasers.vsix
