name: Release

# npm run release -- minor && git push --follow-tags   (see PUBLISH.md)
# → checks, packages the VSIX, publishes to Open VSX and the VS Marketplace
#   (each only if its token secret is set), publishes Neon Glow when its version is new,
#   and creates the GitHub Release from the CHANGELOG.
# build --check also fails if zed/extension.toml and package.json versions differ.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tag, package.json and CHANGELOG agree
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1
          fi
          if ! grep -qE "^## $v( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $v' section"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - run: npm ci --no-audit --no-fund
      - run: node scripts/build.js --check
      - run: node scripts/check-ports.js
      - run: node scripts/check-icons.js
      - run: node scripts/contrast.js

      - name: Package
        run: npx --yes @vscode/vsce package --out "brass-lasers-4am-$VERSION.vsix"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish "brass-lasers-4am-$VERSION.vsix" -p "$OVSX_PAT"

      - name: Publish to VS Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath "brass-lasers-4am-$VERSION.vsix" -p "$VSCE_PAT"

      - name: Publish Neon Glow (only when its version is new)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        working-directory: extensions/glow
        run: |
          gv=$(node -p "require('./package.json').version")
          live=$(curl -sf https://open-vsx.org/api/heyoub/brass-lasers-glow | node -p "JSON.parse(require('fs').readFileSync(0)).version" 2>/dev/null || true)
          if [ "$gv" = "$live" ]; then echo "Neon Glow $gv is already live"; exit 0; fi
          npx --yes @vscode/vsce package --out "brass-lasers-glow-$gv.vsix"
          npx --yes ovsx publish "brass-lasers-glow-$gv.vsix" -p "$OVSX_PAT"

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::No notes under '## $VERSION' in CHANGELOG.md"; exit 1; fi

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "brass-lasers-4am-$VERSION.vsix" \
            --title "Brass Lasers $VERSION" --notes-file notes.md --verify-tag
