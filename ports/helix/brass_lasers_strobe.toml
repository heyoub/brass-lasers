# Brass Lasers Strobe for Helix
# High contrast. Pure black, UV magenta, electric cyan, laser yellow. Every syntax color at WCAG AAA (7:1).
# Generated from palette/strobe.json. Do not edit by hand.

"attribute" = { fg = "uv", modifiers = ["italic"] }
"comment" = { fg = "comment", modifiers = ["italic"] }
"comment.block.documentation" = { fg = "doc", modifiers = ["italic"] }
"constant" = "sunset"
"constant.character.escape" = "cyan"
"constant.numeric" = "sunset"
"constructor" = "brass"
"function" = "cyan"
"function.macro" = { fg = "cyan_light", modifiers = ["bold"] }
"keyword" = "pink"
"keyword.control" = { fg = "pink", modifiers = ["italic"] }
"keyword.storage" = "pink"
"label" = { fg = "sunset", modifiers = ["italic"] }
"namespace" = "uv"
"operator" = "orchid"
"punctuation" = "sub0"
"special" = "cyan"
"string" = "afterglow"
"string.regexp" = "cyan"
"string.special.url" = { fg = "cyan", modifiers = ["underlined"] }
"tag" = "pink"
"type" = "brass"
"type.builtin" = "brass"
"type.parameter" = { fg = "peach", modifiers = ["italic"] }
"variable" = "fg"
"variable.builtin" = { fg = "pink_light", modifiers = ["italic"] }
"variable.parameter" = { fg = "brass_light", modifiers = ["italic"] }
"variable.other.member" = "lavender"

"markup.heading" = { fg = "brass", modifiers = ["bold"] }
"markup.bold" = { fg = "sunset", modifiers = ["bold"] }
"markup.italic" = { fg = "pink_light", modifiers = ["italic"] }
"markup.link.url" = { fg = "cyan", modifiers = ["underlined"] }
"markup.link.text" = "cyan"
"markup.quote" = "uv"
"markup.raw" = "afterglow"
"markup.list" = "uv"

"diff.plus" = "lime"
"diff.minus" = "red"
"diff.delta" = "brass"

"ui.background" = { bg = "base" }
"ui.text" = "fg"
"ui.text.focus" = { fg = "text", bg = "sel_active" }
"ui.cursor" = { fg = "base", bg = "pink" }
"ui.cursor.primary" = { fg = "base", bg = "pink" }
"ui.cursor.match" = { fg = "pink", modifiers = ["bold", "underlined"] }
"ui.cursorline.primary" = { bg = "line" }
"ui.selection" = { bg = "selection" }
"ui.linenr" = "line_nr"
"ui.linenr.selected" = { fg = "brass", modifiers = ["bold"] }
"ui.statusline" = { fg = "sub1", bg = "mantle" }
"ui.statusline.inactive" = { fg = "ghost", bg = "mantle" }
"ui.statusline.normal" = { fg = "on_brass", bg = "brass", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "on_pink", bg = "pink", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "crust", bg = "cyan", modifiers = ["bold"] }
"ui.popup" = { fg = "text", bg = "surface1" }
"ui.window" = "border"
"ui.help" = { fg = "text", bg = "surface1" }
"ui.menu" = { fg = "text", bg = "surface1" }
"ui.menu.selected" = { fg = "text", bg = "sel_active", modifiers = ["bold"] }
"ui.virtual.whitespace" = "whitespace"
"ui.virtual.indent-guide" = "whitespace"
"ui.virtual.ruler" = { bg = "surface0" }
"ui.virtual.inlay-hint" = { fg = "inlay", bg = "surface1" }
"ui.bufferline" = { fg = "ghost", bg = "mantle" }
"ui.bufferline.active" = { fg = "text", bg = "base", modifiers = ["bold"] }

"error" = "red"
"warning" = "sunset"
"info" = "cyan"
"hint" = "uv"
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.warning" = { underline = { color = "sunset", style = "curl" } }
"diagnostic.info" = { underline = { color = "cyan", style = "curl" } }
"diagnostic.hint" = { underline = { color = "uv", style = "curl" } }

[palette]
crust = "#020202"
mantle = "#030304"
base = "#050507"
surface0 = "#09090d"
surface1 = "#101015"
line = "#0c0c10"
border = "#1d1d24"
whitespace = "#23232b"
selection = "#9c4c87"
sel_active = "#59324e"
line_nr = "#3d3d46"
text = "#ffffff"
fg = "#fdf8ec"
sub1 = "#c3c4cf"
sub0 = "#a2a2ad"
comment = "#b9b4cf"
doc = "#c5c1d8"
inlay = "#8f8f99"
ghost = "#7f7f89"
brass = "#ffe24d"
brass_light = "#ffd38a"
peach = "#ffb8f0"
pink = "#ff5fdc"
pink_light = "#ff8de2"
orchid = "#ff9ad6"
cyan = "#2ee8ff"
cyan_light = "#7cf7ff"
sunset = "#ffa24d"
uv = "#c2a8ff"
lavender = "#a8f2ff"
red = "#fe6679"
lime = "#86ff6a"
afterglow = "#86ff6a"
on_pink = "#1a0816"
on_brass = "#140f00"
