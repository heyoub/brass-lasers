# Brass Lasers Soundcheck for Helix
# A matte finish. House lights at half, gaffer-tape charcoal, every color with the shine sanded off. Nothing glossy, nothing loud, everything in its place.
# Generated from palette/soundcheck.json. Do not edit by hand.

