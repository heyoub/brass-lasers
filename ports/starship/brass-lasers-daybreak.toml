# Brass Lasers Daybreak palette for Starship.
# Paste into ~/.config/starship.toml, then use these names anywhere a color goes,
# e.g. style = "bold brass" or format = "[$directory](pink)".

palette = "brass_lasers_daybreak"

[palettes.brass_lasers_daybreak]
crust = "#ebecef"
mantle = "#f0f1f4"
base = "#f5f6fb"
surface = "#e3e5ed"
text = "#262a4a"
subtext = "#5e6489"
comment = "#636a82"
brass = "#8a5a00"
brass_light = "#a6541d"
pink = "#be3278"
pink_light = "#b0306b"
cyan = "#2563a8"
lime = "#262a4a"
afterglow = "#2f7d5b"
sunset = "#c2410c"
uv = "#5b4fc4"
lavender = "#2e6f8e"
red = "#c62828"
blue = "#3a5fc8"
