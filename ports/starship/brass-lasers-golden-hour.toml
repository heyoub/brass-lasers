text = "#1f3a3d"
subtext = "#6e654c"
comment = "#6b6b55"
brass = "#9d5901"
brass_light = "#a8502a"
pink = "#c02e6d"
pink_light = "#b8385f"
cyan = "#00757a"
lime = "#1f3a3d"
afterglow = "#5a7a08"
sunset = "#ba4c0d"
uv = "#6455b8"
lavender = "#246f94"
red = "#c9262c"
blue = "#2867b2"
