# Brass Lasers Golden Hour palette for Starship.
# Paste into ~/.config/starship.toml, then use these names anywhere a color goes,
# e.g. style = "bold brass" or format = "[$directory](pink)".

palette = "brass_lasers_golden-hour"

[palettes.brass_lasers_golden-hour]
crust = "#efeadc"
mantle = "#f4efdd"
base = "#fcf4dc"
