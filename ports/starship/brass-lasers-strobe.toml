# Brass Lasers Strobe palette for Starship.
# Paste into ~/.config/starship.toml, then use these names anywhere a color goes,
# e.g. style = "bold brass" or format = "[$directory](pink)".

palette = "brass_lasers_strobe"

[palettes.brass_lasers_strobe]
crust = "#020202"
mantle = "#030304"
base = "#050507"
surface = "#101015"
text = "#ffffff"
subtext = "#a2a2ad"
comment = "#b9b4cf"
brass = "#ffe24d"
brass_light = "#ffd38a"
pink = "#ff5fdc"
pink_light = "#ff8de2"
cyan = "#2ee8ff"
lime = "#86ff6a"
afterglow = "#86ff6a"
sunset = "#ffa24d"
uv = "#c2a8ff"
lavender = "#a8f2ff"
red = "#fe6679"
blue = "#8ab4ff"
